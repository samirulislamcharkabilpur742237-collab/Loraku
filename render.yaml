services:
  - type: web
    name: loraku-dry-fruits
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: loraku-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/src/data/loraku.db
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
